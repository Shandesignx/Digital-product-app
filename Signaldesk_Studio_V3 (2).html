function docHtml(c,body,title=c.brand,extra=''){let [a,b,bg]=palettes(c);let styleCSS={Minimal:'.card{box-shadow:none;border:1px solid #d9ded9;border-radius:8px}.hero-art{border-radius:8px}.orb{border-radius:15%}h1{font-weight:500}',Bold:'h1{font-weight:900;letter-spacing:-.08em}.hero-art{background:var(--a)}.band{background:var(--a);color:white}.band p,.band .label{color:white}', 'Soft studio':'.card{border-radius:32px;box-shadow:0 14px 30px #22352220}.hero-art{border-radius:46px}.orb{border-radius:45%}'}[c.style]||'';return `<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(title)}</title><style>:root{--a:${a};--b:${b};--bg:${bg};--ink:#191b1b}*{box-sizing:border-box}body{margin:0;font:16px/1.6 Arial,sans-serif;color:var(--ink);background:var(--bg)}main{max-width:1150px;margin:auto;padding:clamp(20px,5vw,75px)}h1,h2,h3,p{margin:0}h1{font-size:clamp(40px,7vw,86px);letter-spacing:-.075em;line-height:1.02}h2{font-size:clamp(24px,4vw,40px);letter-spacing:-.045em;line-height:1.1}p{color:#515654;margin-top:12px}a{color:inherit}button,.button{font:inherit;background:var(--ink);color:white;border:0;border-radius:100px;padding:12px 20px;display:inline-block;text-decoration:none;cursor:pointer}button:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible{outline:3px solid var(--a);outline-offset:4px}header,footer{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap;padding:18px 0}header a{text-decoration:none;font-size:13px}header strong{letter-spacing:-.04em;font-size:20px}.label{font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:bold;color:#4c5b55}.hero{display:grid;grid-template-columns:${c.variant%3===1?'1fr':'1.1fr .9fr'};gap:35px;align-items:center;min-height:390px;padding:40px 0}.hero-art{min-height:300px;border-radius:30px;background:linear-gradient(145deg,var(--b),var(--a));display:grid;place-items:center;overflow:hidden;position:relative}.orb{width:62%;aspect-ratio:1;border-radius:${c.variant%3===2?'30%':'44%'};background:linear-gradient(150deg,#fff,var(--b) 45%,var(--a));box-shadow:25px 35px 55px #14262238,inset 5px 4px 16px #fff;transform:rotate(-20deg)}.orb:after{content:'';position:absolute;width:44%;aspect-ratio:1;background:linear-gradient(145deg,#fff,var(--b));border-radius:40%;right:-12%;bottom:-12%;box-shadow:10px 15px 30px #101b2433}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px;margin-top:20px}.card{padding:25px;background:#fff;border-radius:22px;box-shadow:0 10px 30px #443b2810;border:1px solid #ffffff}.num{font-size:13px;color:#62665f;letter-spacing:.12em}.section{margin:55px 0}.hero .button{margin-top:23px}.band{background:var(--b);padding:35px;border-radius:25px;margin:40px 0}.band .button{margin-top:15px}footer{border-top:1px solid #d8d9d3;font-size:12px}details{padding:18px 0;border-bottom:1px solid #d4d8d2}summary{font-weight:bold;cursor:pointer}input,textarea{font:inherit;width:100%;padding:10px;border:1px solid #b9c3bb;border-radius:8px}label{display:block;margin:10px 0}table{border-collapse:collapse;width:100%}td,th{padding:12px;border-bottom:1px solid #ddd;text-align:left}input[type=checkbox]{width:auto} @media(max-width:660px){.hero,.cards{grid-template-columns:1fr}.hero{gap:18px;min-height:0}.hero-art{min-height:220px}.section{margin:35px 0}main{padding:22px}.card{padding:20px}}@media print{body{background:white}main{max-width:none;padding:15mm}.card{box-shadow:none;border:1px solid #ddd;break-inside:avoid}button,.no-print{display:none}a{text-decoration:none}}${extra}${styleCSS}</style><main>${body}</main></html>`}
const mail=c=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(c.email||'')?esc(c.email):'hello@example.com';function website(c){let entries=c.entries||defaults.entries,portfolio=c.category==='portfolio',cards=entries.map((x,i)=>`<article class="card"><div class="num">0${i+1} / ${portfolio?'PROJECT':'SERVICE'}</div>${portfolio?'<div class="hero-art" style="min-height:140px;margin:12px 0;background:linear-gradient(150deg,var(--b),white)"><div class="orb" style="width:70px"></div></div>':''}<h3>${esc(x.title)}</h3><p>${esc(x.detail)}</p></article>`).join('');return docHtml(c,`<header><strong>${esc(c.brand)}.</strong><nav><a href="#work">${portfolio?'Work':'Services'}</a> &nbsp; <a href="#about">About</a> &nbsp; <a href="#contact">Contact</a></nav></header><section class="hero"><div><div class="label">Independent ${portfolio?'creative portfolio':'business studio'}</div><h1>${esc(c.headline)}</h1><p>${esc(c.description)}</p><a class="button" href="#work">${esc(c.cta)} ↗</a></div><div class="hero-art" aria-hidden="true"><div class="orb"></div></div></section><section class="section" id="work"><div class="label">01 / ${portfolio?'Selected projects':'What we do'}</div><h2>${portfolio?'Selected work.':'Made with purpose.'}</h2><div class="cards">${cards}</div></section><section class="band" id="about"><div class="label">02 / About</div><h2>Considered from the start.</h2><p>${esc(c.description)} Created for ${esc(c.audience)}.</p></section><section class="section" id="contact"><div class="label">03 / Contact</div><h2>Let’s create something.</h2><p>Get in touch to discuss your next project.</p><a class="button" href="mailto:${mail(c)}">${mail(c)}</a></section><footer><strong>${esc(c.brand)}.</strong><span>Independent template · Replace sample copy before publishing.</span></footer>`)}
function documentProduct(c){let k=c.category,entries=c.entries||defaults.entries,heading=`<header><strong>${esc(c.brand)}.</strong><span class="label">${esc(catMap[k]?.[1]||k)} / 0${(+c.variant||0)+1}</span></header><section class="band"><div class="label">${esc(c.audience)}</div><h1>${esc(c.headline)}</h1><p>${esc(c.description)}</p></section>`,body='';if(k==='planner'){body=`<h2>Weekly planning sheet</h2><p>Week of: __________________</p><div class="cards">${['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday','Priorities','Notes'].map(d=>`<article class="card"><h3>${d}</h3>${Array.from({length:4},()=>'<p>□ __________________</p>').join('')}</article>`).join('')}</div><section class="section"><h2>Event budget</h2><table><tr><th>Item</th><th>Budget</th><th>Actual</th><th>Done</th></tr>${['Venue','Decor','Catering','Invitations','Contingency'].map(x=>`<tr><td>${x}</td><td>_______</td><td>_______</td><td>□</td></tr>`).join('')}</table></section>`}else if(k==='resume'){body=`<div class="section"><h2>Professional profile</h2><p>${esc(c.description)}</p><p>${mail(c)} · Location / Portfolio link</p></div><h2>Experience</h2>${entries.map(e=>`<article class="card" style="margin:12px 0"><div class="label">Role · Company · Dates</div><h3>${esc(e.title)}</h3><p>${esc(e.detail)}</p></article>`).join('')}<div class="section"><h2>Education & skills</h2><p>Replace with your verified qualifications, skills and dates.</p></div>`}else if(k==='faq'){body=`<h2>Frequently asked questions</h2>${entries.map(e=>`<details><summary>${esc(e.title)}</summary><p>${esc(e.detail)}</p></details>`).join('')}<p>Still have a question? <a href="mailto:${mail(c)}">Contact us</a>.</p>`}else if(k==='presentation'){body=entries.map((e,i)=>`<section class="band" style="min-height:270px;break-after:page"><div class="label">Slide 0${i+1}</div><h2>${esc(e.title)}</h2><p>${esc(e.detail)}</p><div class="hero-art" style="min-height:120px;margin-top:20px"><div class="orb" style="width:80px"></div></div></section>`).join('')}else if(k==='excel'){body=`<h2>Project price calculator</h2><p>Change inputs to estimate a project price.</p><div class="cards"><label>Hourly rate<input id="rate" type="number" min="0" value="50"></label><label>Hours<input id="hours" type="number" min="0" value="12"></label><label>Expenses<input id="expenses" type="number" min="0" value="100"></label></div><div class="band"><h2 id="total">700.00</h2><p>Estimated total · currency units</p></div><script>const calc=()=>document.getElementById('total').textContent=(Math.max(0,+document.getElementById('rate').value||0)*Math.max(0,+document.getElementById('hours').value||0)+Math.max(0,+document.getElementById('expenses').value||0)).toFixed(2);document.addEventListener('input',calc);<\/script>`}else if(k==='webapp'){body=`<h2>Client feedback board</h2><form id="form"><label>Client / project<input id="name" required></label><label>Feedback<textarea id="feedback" required></textarea></label><button>Add feedback</button></form><div id="feedbacks" class="section"></div><script>let list=[];try{list=JSON.parse(localStorage.getItem('feedback-v1')||'[]')}catch{};function draw(){let root=document.getElementById('feedbacks');root.replaceChildren();list.forEach((x,i)=>{let e=document.createElement('article');e.className='card';let h=document.createElement('h3');h.textContent=x.name;let p=document.createElement('p');p.textContent=x.feedback;let b=document.createElement('button');b.textContent='Remove';b.onclick=()=>{list.splice(i,1);persist()};e.append(h,p,b);root.append(e)})}function persist(){try{localStorage.setItem('feedback-v1',JSON.stringify(list))}catch{}draw()}document.getElementById('form').onsubmit=e=>{e.preventDefault();list.push({name:document.getElementById('name').value,feedback:document.getElementById('feedback').value});e.target.reset();persist()};draw();<\/script>`}else{body=entries.map((e,i)=>`<section class="section"><div class="label">${k==='course'?'Lesson':'Chapter'} 0${i+1}</div><h2>${esc(e.title)}</h2><p>${esc(e.detail)}</p><div class="card" style="margin-top:18px"><h3>Put it into practice</h3><p>Write a concrete next step, gather one example, and record what you learned.</p><p>__________________________________________</p><p>__________________________________________</p></div></section>`).join('')}return docHtml(c,heading+body+`<footer><strong>${esc(c.brand)}</strong><span>Editable source edition · Review sample content before sale.</span></footer>`)}
function file(name,content,type='text/plain'){return {name,content,type}}function makeFiles(c){let k=c.category,f=[],n=slug(c.brand);if(['business','portfolio'].includes(k))f.push(file('index.html',website(c),'text/html'));else if(['social','canva','logo','mockup','invitation','font'].includes(k)){let sizes=k==='social'?[[1080,1080,'square'],[1080,1920,'story'],[1200,628,'landscape']]:k==='invitation'?[[1080,1350,'portrait']]:[[1080,1080,'square']];if(k!=='social'&&c.format&&c.format!=='Auto'&&k!=='logo'){sizes=({Square:[[1080,1080,'square']],Portrait:[[1080,1350,'portrait']],Landscape:[[1200,628,'landscape']]}[c.format]||sizes)}for(let [w,h,s] of sizes)f.push(file(`${n}-${s}.svg`,artwork(c,w,h,k),'image/svg+xml'));if(k==='logo')f.push(file('palette.txt',palettes(c).join('\n')));if(k==='canva'||k==='social')f.push(file('CANVA-EDITING.txt','Native Canva editing: Open your Canva account, create a new design in the required dimensions and recreate/import the SVG as artwork. SVG import may flatten elements; use the editable SVG source or create native Canva text and elements. This offline app does not create a native Canva design or template link.'))}else if(k==='icons'){for(let id of ['business','social','planner','excel','logo','portfolio','spark','library','validation','launch','settings','research']){let s=icon(id).match(/<svg[\s\S]*<\/svg>/)[0].replace('viewBox="0 0 64 64"','width="512" height="512" viewBox="0 0 64 64"');f.push(file(id+'.svg',s,'image/svg+xml'))}}else if(k==='bundle'){f.push(file('index.html',website({...c,category:'business'}),'text/html'),file('social-square.svg',artwork(c,1080,1080,'social'),'image/svg+xml'),file('guide.html',documentProduct({...c,category:'ebook'}),'text/html'))}else{f.push(file('index.html',documentProduct(c),'text/html'));if(k==='notion')f.push(file('workspace.md',`# ${c.headline}\n\n${c.description}\n\n${c.entries.map(e=>`## ${e.title}\n${e.detail}\n- [ ] Next action`).join('\n\n')}\n`));if(k==='excel')f.push(file('calculator.csv','Hourly rate,Hours,Expenses,Estimated total\r\n50,12,100,=A2*B2+C2\r\n','text/csv'));if(k==='planner')f.push(file('planner.csv','Day,Priority,Task,Status\r\n'+['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'].map(d=>d+',,,').join('\r\n'),'text/csv'))}f.push(file('editable-source.json',JSON.stringify(c,null,2),'application/json'),file('README.txt',`${c.brand} — ${catMap[k]?.[1]}\nGenerated locally from editable presets. Open HTML in a browser, edit SVG in a vector editor, import CSV into a spreadsheet, or import Markdown into Notion as appropriate. To edit in Signaldesk, use editable-source.json via Settings. Review all example copy, contact information, contrast, browser behavior, and applicable commercial licensing before sale. No guarantee of marketplace acceptance.\n`));return f}
function current(){return state.products.find(p=>p.id===state.selectedProduct)}function cfg(){return state.config}function editField(label,name,val,type='text'){return `<label class="field"><span>${esc(label)}</span>${type==='textarea'?`<textarea data-config="${name}">${esc(val)}</textarea>`:`<input data-config="${name}" value="${esc(val)}" type="${type}">`}</label>`}const categoryButtons=(list,active)=>`<div class="grid">${list.map(([k,n,d])=>`<button class="category ${active===k?'active':''}" data-action="category" data-key="${k}" aria-pressed="${active===k}">${icon(k)}<b>${esc(n)}</b><p>${esc(d)}</p></button>`).join('')}</div>`;function create(){const c=cfg(),p=current(),active=p&&p.config.category===c.category;const list=view==='design'?cats.filter(x=>['logo','mockup','invitation','social','font','canva','icons'].includes(x[0])):cats;return head(view==='design'?'Design studio':'Create a digital product',view==='design'?'Build original visual assets, editable SVG designs and commercial presentation samples.':'Choose a product, generate editable files, customize your brand and export a ready-to-review package.')+`<div class="card stack"><div class="row between"><h2>01 / Product type</h2>${pill('Local template engine')}</div><div class="category-picker"><label class="field"><span>Choose any product category</span><select id="categorySelect">${list.map(([k,n])=>`<option value="${k}" ${k===c.category?'selected':''}>${esc(n)}</option>`).join('')}</select></label>${categoryButtons(list.filter((x,i)=>i<4||x[0]===c.category),c.category)}<details><summary>Browse all ${list.length} product categories</summary>${categoryButtons(list.filter((x,i)=>i>=4&&x[0]!==c.category),c.category)}</details></div></div><div class="workspace"><div class="card stack"><div class="row between"><h2>02 / Creative direction</h2></div><button id="generate" class="primary" data-action="generate">✦ Generate product</button><p class="small">Smart defaults are ready. Customize now or generate immediately.</p>${editField('Brand / product name','brand',c.brand)}${editField('Headline','headline',c.headline)}${editField('Description','description',c.description,'textarea')}${editField('Audience','audience',c.audience)}${editField('Call to action','cta',c.cta)}${editField('Contact email','email',c.email,'email')}<label class="field"><span>Design style</span><select data-config="style">${opt(['Editorial','Minimal','Bold','Soft studio'],c.style)}</select></label><label class="field"><span>Format preference (where supported)</span><select data-config="format">${opt(['Auto','Square','Portrait','Landscape'],c.format)}</select></label><div class="field"><span><b>Palette</b></span><div class="row">${schemes.map((s,i)=>`<button class="swatch ${i===c.scheme?'selected':''}" style="background:${s[1]}" data-action="scheme" data-index="${i}" title="${s[0]}" aria-label="${s[0]}"></button>`).join('')}<input type="color" data-config="accent" value="${palettes(c)[0]}" aria-label="Custom accent color"></div></div>${editField('Creative brief / notes','prompt',c.prompt,'textarea')}<p class="small">Brief is saved as metadata. This version uses deterministic templates, not a connected AI model.</p><h3>Editable content blocks</h3>${c.entries.map((e,i)=>`<div class="stack" style="padding:12px;border:1px solid var(--line);border-radius:14px">${editEntry(i,'title',e.title)}${editEntry(i,'detail',e.detail)}${btn('Remove block','removeEntry','danger','data-index="'+i+'"')}</div>`).join('')}${btn('＋ Add block','addEntry')}<p class="small">Produces real local files. Check all copy and commercial usage rights before listing.</p></div><div class="card stack"><div class="row between"><h2>03 / Live output</h2>${pill(active?'Editable preview':'Ready to generate',active?'good':'')}</div>${active?`<div class="row between"><div><b>${esc(c.brand)}</b><p class="small">${esc(catMap[c.category][1])} · Version ${p.versions.length}</p></div>${btn('Save revision','saveRevision')}</div><div class="tabs">${['Editorial','Sculpted','Geometric'].map((v,i)=>`<button class="${c.variant===i?'active':''}" data-action="variant" data-index="${i}">${v}</button>`).join('')}</div><div class="preview-toolbar"><button data-action="mode" data-mode="desktop" class="${previewMode==='desktop'?'active':''}">Desktop</button><button data-action="mode" data-mode="mobile" class="${previewMode==='mobile'?'active':''}">Mobile</button><button data-action="mode" data-mode="zoom" class="${previewMode==='zoom'?'active':''}">Inspect</button>${btn('Compare variants','compareVariants')}</div><div id="preview" class="stage ${previewMode}"></div><div id="fileTabs" class="tabs"></div><div class="row"><button class="primary" data-action="downloadZip">↓ Download ZIP</button>${btn('Editable source','downloadSource')}${btn('Current file','downloadFile')}</div><div class="row">${btn('PNG preview','downloadPNG')}${btn('Open Canva','openCanva')}${btn('Version history','versions')}</div><div class="notice">Canva-ready SVG/source is not a native Canva template link. Open Canva to create native editable layers; store the resulting link in Settings or on a saved product.</div>`:`<div class="stage"><div class="empty">${icon(c.category)}<h2>Make it yours.</h2><p>Choose a product type and generate an editable preview.</p></div></div>`}</div></div>`}function editEntry(i,k,v){return `<label class="field"><span>${k==='title'?'Block title':'Block description'}</span><input data-entry="${i}" data-entrykey="${k}" value="${esc(v)}"></label>`}
function variantPreview(c,i){let f=makeFiles(c).find(f=>['text/html','image/svg+xml'].includes(f.type));return f?.type==='text/html'?`<iframe title="Variant ${i+1}" sandbox="allow-scripts" style="width:100%;height:320px;border:0;border-radius:10px;background:white" srcdoc="${esc(f.content)}"></iframe>`:`<img alt="Variation ${i+1}" style="width:100%;height:auto" src="data:image/svg+xml;charset=utf-8,${encodeURIComponent(f?.content||artwork(c))}">`}function preview(){let e=$('#preview');if(!e)return;let files=makeFiles(cfg()).filter(f=>['text/html','image/svg+xml'].includes(f.type));if(!files.length)return;previewFile=clamp(previewFile,0,files.length-1);let f=files[previewFile];e.replaceChildren();if(f.type==='text/html'){let frame=document.createElement('iframe');frame.title='Generated editable product preview';frame.sandbox='allow-scripts';frame.srcdoc=f.content;e.append(frame)}else{let img=document.createElement('img');img.alt='Generated '+f.name;img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(f.content);e.append(img)}$('#fileTabs').innerHTML=files.map((f,i)=>`<button class="${i===previewFile?'active':''}" data-action="fileTab" data-index="${i}">${esc(f.name)}</button>`).join('')}
function templates(){return head('Template collection','Start from a commercial product preset, then refine it in the generator.')+`<div class="grid">${cats.map(([k,n,d],i)=>`<div class="card product-tile"><div class="tile-art" style="background:linear-gradient(145deg,${schemes[i%6][3]},${schemes[i%6][2]})">${icon(k)}</div><div><h3>${n}</h3><p class="small">${d}</p></div><button class="primary" data-action="template" data-key="${k}" data-index="${i%6}">Use preset ↗</button></div>`).join('')}</div>`}
function library(){return head('Your product library','Open, revise, duplicate and export locally saved products.')+`<div class="grid">${state.products.map(p=>`<div class="card product-tile"><div class="tile-art" style="background:linear-gradient(145deg,${palettes(p.config)[2]},${palettes(p.config)[1]})">${icon(p.config.category)}</div><h3>${esc(p.config.brand)}</h3><p>${esc(catMap[p.config.category]?.[1])} · ${p.versions.length} versions · ${esc(p.updated)}</p>${p.canva?`<a href="${safeUrl(p.canva)}" target="_blank" rel="noopener">Native Canva link ↗</a>`:''}<div class="row">${btn('Open','openProduct','primary','data-id="'+esc(p.id)+'"')}${btn('Duplicate','duplicateProduct','','data-id="'+esc(p.id)+'"')}${btn('Canva link','productCanva','','data-id="'+esc(p.id)+'"')}${btn('Delete','deleteProduct','danger','data-id="'+esc(p.id)+'"')}</div></div>`).join('')||`<div class="card stack"><h2>Your studio is ready.</h2><p>Generate your first product and it will appear here.</p><button class="primary" data-nav="create">Create product</button></div>`}</div>`}
function settings(){return head('Workspace settings','Back up your data, manage editable sources, and connect to your external creative tools manually.')+`<div class="grid two"><div class="card stack"><h2>Workspace</h2><form id="settingsForm" class="stack">${field('Workspace name','workspace',state.settings.workspace)}${field('Optional Canva design link','canvaLink',state.settings.canvaLink,'url')}<button class="primary" type="submit">Save settings</button></form><p class="small">Data is stored in this browser. No account sync or database connection.</p></div><div class="card stack"><h2>Backup & restore</h2><p>Download all ideas, product records, versions and settings. Import either a workspace backup or an editable product source.</p>${btn('Export workspace JSON','backup','primary')}${btn('Import JSON','import')}${btn('Export research CSV','researchCSV')}</div><div class="card stack"><h2>External creative tools</h2>${[['Canva','https://www.canva.com/'],['ChatGPT','https://chatgpt.com/'],['Claude','https://claude.ai/'],['Gemini','https://gemini.google.com/'],['Codex','https://chatgpt.com/codex']].map(([n,u])=>`<div class="linkrow"><b>${n}</b><a href="${u}" target="_blank" rel="noopener">Open ↗</a></div>`).join('')}<p class="small">These are external links, not connected APIs.</p></div><div class="card stack"><h2>System status</h2>${pill('Template generation available','good')}${pill('Live market API not connected','warn')}${pill('Native Canva OAuth not connected','warn')}<p>To migrate the original project, export its database and inspect the existing code/API contracts first.</p></div></div>`}
function render(){chrome();const fn={overview,research,compare,priority,outline:workflow,validation:workflow,launch:workflow,decisions:workflow,create,design:create,templates,library,settings}[view];$('#page').innerHTML=fn();if(view==='create'||view==='design')preview()}

document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.id==='menu'){$('#side').classList.toggle('open');return}if(b.dataset.nav){e.preventDefault();if(b.dataset.nav==='design'&&!['logo','mockup','invitation','social','font','canva','icons'].includes(cfg().category)){cfg().category='logo';state.selectedProduct=''}go(b.dataset.nav);return}if(b.dataset.action&&actions[b.dataset.action]){e.preventDefault();actions[b.dataset.action](b)}});document.addEventListener('input',e=>{let t=e.target;if(t.dataset.config!==undefined){cfg()[t.dataset.config]=t.value;save();preview()}if(t.dataset.entry!==undefined){cfg().entries[+t.dataset.entry][t.dataset.entrykey]=t.value;save();preview()}if(t.dataset.checknote){let x=selected().checks.find(x=>x.id===t.dataset.checknote);if(x){x.notes=t.value;save()}}if(t.id==='searchIdeas'){filter=t.value;let pos=t.selectionStart;render();let n=$('#searchIdeas');n.focus();n.setSelectionRange(pos,pos)}});document.addEventListener('change',e=>{let t=e.target;if(t.id==='categorySelect'){state.selectedProduct='';cfg().category=t.value;previewFile=0;save();render()}if(t.id==='platformFilter'){platformFilter=t.value;render()}if(t.id==='ideaSelect'){state.selectedIdea=t.value;save();render()}if(t.dataset.check){let x=selected().checks.find(x=>x.id===t.dataset.check);x.done=t.checked;save();render()}if(t.dataset.launch){selected().launch[t.dataset.launch]=t.checked;save();render()}if(t.dataset.config==='style'||t.dataset.config==='format'){cfg()[t.dataset.config]=t.value;save();preview()}});document.addEventListener('submit',e=>{let f=e.target;let ids=['ideaForm','outlineForm','checkForm','decisionForm','settingsForm','canvaForm'];if(!ids.includes(f.id))return;e.preventDefault();let d=Object.fromEntries(new FormData(f));if(f.id==='ideaForm'){let i=state.ideas.find(x=>x.id===f.dataset.id)||newIdea();for(let k of ['name','category','channel','format','demand','competition','evidenceUrl','price','currency','priceBasis','chec
